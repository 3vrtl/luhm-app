<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luhm · Zettelkasten-Konzept</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper: oklch(0.992 0.003 95);
    --panel: oklch(0.980 0.004 95);
    --panel-2: oklch(0.966 0.005 92);
    --ink: oklch(0.26 0.013 60);
    --ink-soft: oklch(0.47 0.012 60);
    --ink-faint: oklch(0.64 0.010 62);
    --ink-ghost: oklch(0.80 0.006 70);
    --line: oklch(0.905 0.004 80);
    --line-soft: oklch(0.945 0.003 80);
    --accent: oklch(0.52 0.105 250);
    --accent-ink: oklch(0.45 0.11 250);
    --accent-wash: oklch(0.52 0.105 250 / 0.10);
    --accent-line: oklch(0.52 0.105 250 / 0.40);

    --sans: 'Hanken Grotesk', system-ui, sans-serif;
    --serif: 'Newsreader', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  /* ---------- shared atoms ---------- */
  .mono{ font-family: var(--mono); font-feature-settings: "tnum" 1; letter-spacing: -0.01em; }
  .serif{ font-family: var(--serif); }

  .zid{ font-family: var(--mono); color: var(--accent-ink); letter-spacing: -0.02em; font-weight: 500; }

  /* relation tag */
  .reltag{
    display:inline-flex; align-items:center; gap:6px;
    font-size: 11px; font-weight:600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .reldot{ width:6px; height:6px; border-radius:50%; background: var(--ink-faint); }
  .reldot.folge{ background: var(--accent); }
  .reldot.verzweig{ background: var(--ink-soft); }
  .reldot.verweis{ width:6px;height:6px;border-radius:50%;border:1.5px solid var(--accent); background:transparent; }
  .reldot.vor{ background: var(--ink-ghost); }
  .reldot.ki{ background: transparent; border:1.5px dashed var(--ink-faint); }

  /* neighbor card */
  .ncard{
    background: var(--paper); border:1px solid var(--line);
    border-radius: 10px; padding: 13px 15px; cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .ncard:hover{ border-color: var(--accent-line); transform: translateY(-1px); box-shadow: 0 6px 20px -12px oklch(0.4 0.05 250 / .35); }
  .ncard .nid{ font-family: var(--mono); font-size: 12px; color: var(--accent-ink); font-weight:500; }
  .ncard .ntext{ font-family: var(--serif); font-size: 15px; line-height: 1.42; color: var(--ink-soft); margin-top:6px; }
  .ncard.ghost{ border-style: dashed; border-color: var(--ink-ghost); background: transparent; }
  .ncard.ghost .nid{ color: var(--ink-faint); }

  /* primary zettel */
  .zettel-body{ font-family: var(--serif); font-weight: 400; color: var(--ink); }

  .pill{
    display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px;
    border-radius: 999px; border:1px solid var(--line); background:var(--paper);
    font-size: 13px; font-weight:500; color: var(--ink-soft); cursor:pointer;
    transition: border-color .15s, color .15s;
  }
  .pill:hover{ border-color: var(--accent-line); color: var(--ink); }
  .pill.solid{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pill.solid:hover{ color: var(--paper); }

  .tag{
    display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:6px;
    background: var(--panel-2); color: var(--ink-soft); font-size:12px; font-weight:500;
    border:1px solid var(--line-soft);
  }

  .seclabel{
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color: var(--ink-faint);
  }

  /* app chrome */
  .rail{
    width:60px; flex:0 0 60px; background: var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:4px;
  }
  .rail .logo{ font-family: var(--serif); font-weight:500; font-size:22px; color: var(--ink); margin-bottom:18px; }
  .railbtn{
    width:40px; height:40px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color: var(--ink-faint); cursor:pointer; transition: background .15s, color .15s;
  }
  .railbtn:hover{ background: var(--panel-2); color: var(--ink); }
  .railbtn.active{ background: var(--accent-wash); color: var(--accent-ink); }
  .railbtn svg{ width:20px; height:20px; }

  .topbar{
    height:54px; flex:0 0 54px; border-bottom:1px solid var(--line); display:flex; align-items:center;
    padding:0 26px; gap:14px; color: var(--ink-faint); font-size:13px;
  }
  .crumb{ font-family: var(--mono); color: var(--ink-soft); }
  .crumb .sep{ color: var(--ink-ghost); margin:0 8px; }

  .kbd{ font-family: var(--mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; color: var(--ink-faint); }

  .scrollcol::-webkit-scrollbar{ width:8px; }
  .scrollcol::-webkit-scrollbar-thumb{ background: var(--line); border-radius:99px; }

  #root{ min-height:100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="concept.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
</body>
</html>
