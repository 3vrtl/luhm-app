<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luhm · Konzeptentwurf v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper: oklch(0.992 0.003 95);
    --panel: oklch(0.980 0.004 95);
    --panel-2: oklch(0.966 0.005 92);
    --ink: oklch(0.26 0.013 60);
    --ink-soft: oklch(0.47 0.012 60);
    --ink-faint: oklch(0.64 0.010 62);
    --ink-ghost: oklch(0.80 0.006 70);
    --line: oklch(0.905 0.004 80);
    --line-soft: oklch(0.945 0.003 80);
    --accent: oklch(0.52 0.105 250);
    --accent-ink: oklch(0.45 0.11 250);
    --accent-wash: oklch(0.52 0.105 250 / 0.10);
    --accent-line: oklch(0.52 0.105 250 / 0.40);
    --sans: 'Hanken Grotesk', system-ui, sans-serif;
    --serif: 'Newsreader', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; background: var(--paper); }
  body{ font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #app{ height:100vh; display:flex; overflow:hidden; }

  .mono{ font-family: var(--mono); font-feature-settings: "tnum" 1; letter-spacing:-0.01em; }
  .serif{ font-family: var(--serif); }
  .zettel-body{ font-family: var(--serif); font-weight:400; color: var(--ink); }

  /* Auswahl-Formatierpille (Editor) */
  .fmtpill{ position:absolute; z-index:40; transform:translate(-50%, calc(-100% - 9px)); display:flex; gap:1px; padding:3px; background:var(--ink); border-radius:9px; box-shadow:0 8px 22px -8px oklch(0.3 0.04 260 / .55); }
  .fmtpill::after{ content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--ink); }
  .fmtpill-b{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; background:none; color:oklch(1 0 0 / .82); font-family:var(--sans); font-size:14px; line-height:1; border-radius:6px; cursor:pointer; transition:background .12s, color .12s; }
  .fmtpill-b:hover{ background:oklch(1 0 0 / .14); color:#fff; }

  /* relation dots */
  .reldot{ width:7px; height:7px; border-radius:50%; background: var(--ink-faint); flex:0 0 auto; }
  .reldot.folge{ background: var(--accent); }
  .reldot.verzweig{ background: var(--ink-soft); }
  .reldot.verweis{ width:7px;height:7px;border-radius:50%;border:1.5px solid var(--accent); background:transparent; }
  .reldot.vor{ background: var(--ink-ghost); }
  .reldot.ki{ background: transparent; border:1.5px dashed var(--ink-faint); }
  .reltag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color: var(--ink-faint); }

  /* neighbour card */
  .ncard{ background: var(--paper); border:1px solid var(--line); border-radius:11px; padding:13px 15px; cursor:pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .ncard:hover{ border-color: var(--accent-line); transform: translateY(-1px); box-shadow:0 8px 22px -14px oklch(0.4 0.05 250 / .4); }
  .ncard:active{ transform: translateY(0); }
  .ncard .nid{ font-family: var(--mono); font-size:12.5px; color: var(--accent-ink); font-weight:500; }
  .ncard .ntext{ font-family: var(--serif); font-size:15px; line-height:1.42; color: var(--ink-soft); margin-top:6px; }
  .ncard.ghost{ border-style:dashed; border-color: var(--ink-ghost); background:transparent; }
  .ncard.ghost .nid{ color: var(--ink-faint); }

  .pill{ display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 15px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font:inherit; font-size:13px; font-weight:600; color: var(--ink-soft); cursor:pointer; transition: border-color .15s, color .15s, background .15s; }
  .pill:hover{ border-color: var(--accent-line); color: var(--ink); }
  .pill.solid{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pill.solid:hover{ color: var(--paper); background: oklch(0.32 0.013 60); }
  .pill:disabled{ opacity:.4; cursor:default; }
  .pill svg{ width:15px; height:15px; }
  /* minimalistische Sekundär-Aktionen: randlos, treten erst beim Hover hervor */
  .act{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 9px; border:none; background:none; font:inherit; font-size:12.5px; font-weight:500; color:var(--ink-faint); cursor:pointer; border-radius:8px; transition:color .14s, background .14s; white-space:nowrap; }
  .act:hover{ color:var(--accent-ink); background:var(--panel-2); }
  .act svg{ width:14px; height:14px; opacity:.8; }
  .act-div{ width:1px; height:18px; background:var(--line); margin:0 6px; flex:0 0 auto; }
  /* Mini-Keycap in Aktionsknöpfen */
  .actkey{ font-family:var(--mono); font-size:9.5px; font-weight:700; line-height:1; padding:2px 4px; border-radius:4px; border:1px solid var(--line); color:var(--ink-ghost); margin-left:2px; }
  .pill.solid .actkey{ border-color:oklch(1 0 0 / .28); color:oklch(1 0 0 / .8); }
  .act:hover .actkey{ border-color:var(--accent-line); color:var(--accent-ink); }
  /* Tastatur-Hinweiszeile im Lesen-Modus */
  .readkeys{ display:flex; align-items:center; gap:7px 18px; margin-top:20px; padding-top:15px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--ink-ghost); flex-wrap:wrap; }
  .readkeys span{ display:inline-flex; align-items:center; gap:6px; }
  .readkeys .kbd{ color:var(--ink-faint); }

  .tag{ display:inline-flex; align-items:center; height:25px; padding:0 11px; border-radius:6px; background: var(--panel-2); color: var(--ink-soft); font-size:12px; font-weight:500; border:1px solid var(--line-soft); }
  /* editierbare Schlagwörter */
  .tag.tag-ed{ padding-right:5px; gap:5px; transition: border-color .14s, background .14s; }
  .tag.tag-ed:hover{ border-color: var(--accent-line); }
  .tag-x{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border:none; border-radius:4px; background:transparent; color: var(--ink-ghost); cursor:pointer; padding:0; transition: color .14s, background .14s; }
  .tag-x:hover{ color: var(--accent-ink); background: var(--accent-wash); }
  .tag-x svg{ width:10px; height:10px; }
  .tag-add{ display:inline-flex; align-items:center; gap:5px; height:25px; padding:0 10px 0 8px; border-radius:6px; background:transparent; color: var(--ink-faint); font-size:12px; font-weight:500; border:1px dashed var(--line); cursor:pointer; transition: color .14s, border-color .14s; }
  .tag-add:hover{ color: var(--accent-ink); border-color: var(--accent-line); }
  .tag-add svg{ width:11px; height:11px; }
  .tag-input{ height:25px; min-width:96px; padding:0 9px; border-radius:6px; border:1px solid var(--accent-line); background: var(--paper); font:inherit; font-size:12px; font-weight:500; color: var(--ink); outline:none; caret-color: var(--accent); }
  .seclabel{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color: var(--ink-faint); }
  .zid{ font-family: var(--mono); color: var(--accent-ink); font-weight:500; letter-spacing:-0.02em; }
  .kbd{ font-family: var(--mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; color: var(--ink-faint); }

  /* rail */
  .rail{ width:62px; flex:0 0 62px; background: var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:4px; z-index:5; }
  .rail .logo{ font-family: var(--serif); font-weight:500; font-size:23px; color: var(--ink); margin-bottom:18px; }
  .railbtn{ position:relative; width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; color: var(--ink-faint); cursor:pointer; transition: background .15s, color .15s; border:none; background:transparent; }
  .railbtn:hover{ background: var(--panel-2); color: var(--ink); }
  .railbtn.active{ background: var(--accent-wash); color: var(--accent-ink); }
  .railbtn svg{ width:20px; height:20px; }
  /* anklickbare Tastatur-Hinweise in der Topbar */
  .kbhint{ display:inline-flex; align-items:center; gap:7px; color: var(--ink-faint); font-size:13px; background:none; border:none; cursor:pointer; padding:5px 8px; border-radius:8px; transition: background .14s, color .14s; }
  .kbhint:hover{ background: var(--panel-2); color: var(--ink); }
  .kbhint svg{ width:15px; height:15px; }
  .kbhelp{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--ink-faint); font-family:var(--mono); font-size:13px; font-weight:600; cursor:pointer; transition: background .14s, color .14s, border-color .14s; }
  .kbhelp:hover{ color:var(--accent-ink); border-color:var(--accent-line); }

  /* topbar + segmented switch */
  .topbar{ height:60px; flex:0 0 60px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 22px; gap:16px; background: var(--paper); z-index:4; }
  .crumb{ font-family: var(--mono); font-size:13px; color: var(--ink-soft); display:flex; align-items:center; }
  .crumb .sep{ color: var(--ink-ghost); margin:0 7px; }
  .crumb .seg-id{ cursor:pointer; }
  .crumb .seg-id:hover{ color: var(--accent-ink); }

  .seg{ display:inline-flex; background: var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; }
  .seg button{ display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 15px; border:none; background:transparent; border-radius:8px; font:inherit; font-size:13px; font-weight:600; color: var(--ink-soft); cursor:pointer; transition: background .18s, color .18s, box-shadow .18s; }
  .seg button svg{ width:15px; height:15px; }
  .seg button:hover{ color: var(--ink); }
  .seg button.on{ background: var(--paper); color: var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.07); }

  .stage{ flex:1; min-height:0; position:relative; }
  .fade{ animation: fade .32s cubic-bezier(.2,.7,.3,1); height:100%; }
  @keyframes fade{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:none; } }

  /* graph */
  .gwrap{ position:absolute; inset:0; overflow:hidden; }
  .gcard{ position:absolute; transform: translate(-50%,-50%); width:212px; cursor:pointer; z-index:2; transition: left .4s cubic-bezier(.3,.8,.3,1), top .4s cubic-bezier(.3,.8,.3,1); }
  .gcenter{ position:absolute; transform: translate(-50%,-50%); width:316px; z-index:3; transition: left .4s cubic-bezier(.3,.8,.3,1), top .4s cubic-bezier(.3,.8,.3,1); }
  .gcenter .inner{ background: var(--paper); border:1.5px solid var(--ink); border-radius:16px; padding:22px 24px; box-shadow:0 30px 70px -34px oklch(0.3 0.04 250 / .45); }

  /* Graph: richtungsbasierte Hierarchie */
  .gcard-bottom .ncard{ border-color: var(--accent-line); }
  .gcard-top .ncard{ background: var(--panel); }
  .glegend{ position:absolute; right:20px; bottom:18px; z-index:5; display:flex; flex-direction:column; gap:7px; background: var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 12px 32px -22px rgba(0,0,0,.45); pointer-events:none; }
  .glegend span{ display:flex; align-items:center; gap:10px; font-size:11.5px; color: var(--ink-soft); font-weight:500; }
  .glegend .lg{ width:18px; height:0; border-top:2px solid currentColor; display:inline-block; flex:0 0 18px; }
  .glegend .lg-folge{ color: var(--accent); border-top-width:2.5px; }
  .glegend .lg-vor{ color: var(--ink-soft); opacity:.55; }
  .glegend .lg-verzweig{ color: var(--ink-soft); }
  .glegend .lg-verweis{ color: var(--accent-ink); }
  .glegend .lg-ki{ color: var(--ink-faint); border-top-style:dashed; }

  .scrollcol::-webkit-scrollbar{ width:9px; }
  .scrollcol::-webkit-scrollbar-thumb{ background: var(--line); border-radius:99px; }
  .scrollcol::-webkit-scrollbar-track{ background: transparent; }

  textarea{ font-family: var(--serif); }
  textarea::placeholder{ color: var(--ink-ghost); }

  /* In-place-Bearbeitung */
  .editbtn{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; margin-left:4px; border:1px solid var(--line); background:var(--paper); border-radius:8px; font:inherit; font-size:12px; font-weight:600; color: var(--ink-faint); cursor:pointer; opacity:0; transition: opacity .15s, color .15s, border-color .15s; }
  .reading:hover .editbtn{ opacity:1; }
  .editbtn:hover{ color: var(--accent-ink); border-color: var(--accent-line); }
  .editbtn svg{ width:13px; height:13px; }
  .zbody-edit{ cursor: text; margin-left:-12px !important; padding:6px 12px; border-radius:9px; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s, background .15s; }
  .zbody-edit:hover{ box-shadow: inset 0 0 0 1px var(--line); background: oklch(0.985 0.004 95); }
  .zedit{ caret-color: var(--accent); }

  /* Navigations-Hinweise */
  .keycap{ display:inline-flex; align-items:center; justify-content:center; min-width:19px; height:19px; padding:0 5px; font-family: var(--mono); font-size:11px; font-weight:600; color: var(--ink-soft); background: var(--paper); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; line-height:1; }

  /* ===== Befehls-/Sprungpalette (⌘K) ===== */
  .cmdk-scrim{ position:fixed; inset:0; background:oklch(0.3 0.03 260 / 0.32); backdrop-filter:blur(2px); z-index:120; display:flex; align-items:flex-start; justify-content:center; padding-top:13vh; animation:cmdk-in .12s ease; }
  @keyframes cmdk-in{ from{ opacity:0; } to{ opacity:1; } }
  .cmdk{ width:min(620px, 92vw); background:var(--paper); border:1px solid var(--line); border-radius:15px; box-shadow:0 32px 80px -30px oklch(0.35 0.05 260 / .7); overflow:hidden; display:flex; flex-direction:column; max-height:64vh; }
  .cmdk-head{ display:flex; align-items:center; gap:11px; padding:15px 17px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .cmdk-input{ flex:1; border:none; outline:none; background:transparent; font:inherit; font-size:17px; color:var(--ink); }
  .cmdk-input::placeholder{ color:var(--ink-ghost); }
  .cmdk-list{ overflow-y:auto; padding:7px; min-height:0; }
  .cmdk-sec{ font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-ghost); padding:9px 10px 5px; }
  .cmdk-row{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; padding:9px 10px; border-radius:9px; cursor:pointer; color:var(--ink); }
  .cmdk-row.on{ background:var(--accent-wash); }
  .cmdk-ic{ flex:0 0 auto; display:inline-flex; color:var(--ink-faint); }
  .cmdk-ic svg{ width:16px; height:16px; }
  .cmdk-row.on .cmdk-ic{ color:var(--accent-ink); }
  .cmdk-label{ flex:1; min-width:0; font-size:14.5px; }
  .cmdk-hint{ flex:0 0 auto; font-size:11.5px; color:var(--ink-ghost); }
  .cmdk-addr{ flex:0 0 auto; font-size:13px; font-weight:600; color:var(--accent-ink); min-width:46px; }
  .cmdk-txt{ flex:1; min-width:0; font-size:13px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmdk-empty{ font-size:13.5px; color:var(--ink-ghost); font-style:italic; padding:18px 12px; }
  .cmdk-foot{ display:flex; gap:18px; padding:11px 16px; border-top:1px solid var(--line); flex:0 0 auto; font-size:12px; color:var(--ink-ghost); }
  .cmdk-foot .kbd{ margin-right:4px; }

  /* ===== Tastatur-Hilfe (?) ===== */
  .help-scrim{ position:fixed; inset:0; background:oklch(0.3 0.03 260 / 0.32); backdrop-filter:blur(2px); z-index:120; display:flex; align-items:center; justify-content:center; padding:24px; animation:cmdk-in .12s ease; }
  .help{ width:min(680px, 94vw); background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:0 32px 80px -30px oklch(0.35 0.05 260 / .7); padding:26px 28px 22px; }
  .help-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:22px; }
  .help-title{ font-size:24px; font-weight:400; color:var(--ink); letter-spacing:-0.01em; }
  .help-x{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink-faint); cursor:pointer; }
  .help-x svg{ width:15px; height:15px; }
  .help-x:hover{ color:var(--accent-ink); border-color:var(--accent-line); }
  .help-grid{ display:grid; grid-template-columns:1fr 1fr; gap:26px 34px; }
  .help-coltitle{ font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .help-rows{ display:flex; flex-direction:column; gap:9px; }
  .help-row{ display:flex; align-items:center; gap:12px; }
  .help-keys{ display:inline-flex; gap:3px; flex:0 0 auto; min-width:64px; }
  .help-label{ font-size:13.5px; color:var(--ink-soft); }
  .help-foot{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-ghost); }
  .help-foot .kbd{ margin:0 2px; }

  /* Richtungs-Peeks am Rand der Lesefläche */
  /* ===== Umgebungs-Kompass (rechts) =====
     Aktueller Zettel = Mittelpunkt. SENKRECHT die Reihe (Vorgänger ↑ / Folgezettel ↓),
     WAAGERECHT die Verzweigungs-Tiefe (Eltern ← / Verzweigung →). Alles absolut um
     den Mittelpunkt → feste, gleichmäßige Abstände, dieselbe Struktur aus jeder Sicht. */
  .nmap{ position:absolute; right: clamp(124px, 12vw, 210px); top:50%; transform:translateY(-50%); z-index:3; opacity:.64; transition:opacity .22s; }
  .nmap:hover{ opacity:1; }
  /* rechter Korridor: der zentrierte Lesetext rückt nach links, der Kompass bekommt eigenen Raum */
  @media (min-width: 901px){ .lesen-reading{ padding-right: clamp(220px, 19vw, 360px) !important; } }
  .nmap-compass{ position:relative; width:0; height:0; }
  .cmp-link{ position:absolute; background:var(--line); }
  .cmp-node{ position:absolute; background:none; border:none; padding:0; cursor:pointer; color:var(--ink-faint); transition:color .14s; }
  .cmp-node:hover{ color:var(--accent-ink); }
  .cmp-node > .reldot{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); width:7px; height:7px; }
  .cmp-addr{ position:absolute; white-space:nowrap; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:-0.02em; }
  .cmp-key{ color:var(--ink-ghost); opacity:0; transition:opacity .18s; }
  .nmap:hover .cmp-key{ opacity:1; }
  .cmp-node.more{ color:var(--ink-ghost); }
  .cmp-node.more:hover{ color:var(--accent-ink); }
  .cmp-node.more > span{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); font-family:var(--mono); font-size:13px; font-weight:700; line-height:1; }
  .cmp-cur{ position:absolute; left:0; top:0; }
  .cmp-curdot{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3.5px var(--accent-wash); }
  .cmp-curaddr{ position:absolute; left:11px; top:0; transform:translateY(-50%); white-space:nowrap; font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-faint); letter-spacing:-0.02em; background:var(--paper); padding:0 3px; }
  @media (max-width: 900px){ .nmap{ display:none; } }
  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background: var(--ink); color: var(--paper); font-size:13px; font-weight:600; padding:11px 18px; border-radius:10px; box-shadow:0 16px 40px -16px rgba(0,0,0,.4); z-index:50; animation: fade .3s; display:flex; align-items:center; gap:9px; }

  /* ===== Register / Übersicht ===== */
  .ovwrap{ position:absolute; inset:0; overflow-y:auto; scrollbar-gutter:stable; }
  .ovinner{ max-width:840px; margin:0 auto; padding:62px 44px 96px; }
  .ovhead{ margin-bottom:30px; }
  .ovtitle{ font-size:44px; font-weight:400; letter-spacing:-0.02em; color:var(--ink); margin:6px 0 12px; line-height:1.04; }
  .ovsub{ font-size:15.5px; color:var(--ink-faint); max-width:560px; line-height:1.55; margin:0; }

  /* Variante A — kompakte, einklappbare Liste */
  .reglist.compact{ display:flex; flex-direction:column; border-top:1px solid var(--line); }
  .reglist{ display:flex; flex-direction:column; }
  .regrow{ border-bottom:1px solid var(--line); }
  .reghead{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:transparent; border:none; padding:12px; cursor:pointer; border-radius:9px; transition: background .14s; }
  .reghead:hover{ background: var(--panel-2); }
  .regtwist{ flex:0 0 auto; color:var(--ink-ghost); display:inline-flex; transition: transform .18s, color .16s; }
  .regtwist svg{ width:15px; height:15px; }
  .regrow.open .regtwist{ transform: rotate(90deg); }
  .reghead:hover .regtwist{ color:var(--accent-ink); }
  .reghead:focus-visible{ background: var(--accent-wash); outline:none; }
  .reghead:focus{ outline:none; }
  .regbody-wrap .rthema:focus-visible,
  .regbody-wrap button:focus-visible,
  .regbody-wrap a:focus-visible,
  .regchip:focus-visible{ outline:2px solid var(--accent-ink); outline-offset:2px; border-radius:7px; }

  /* Stammnummer: Klick öffnet die Notiz, Stift erscheint bei Hover */
  .regnum-wrap{ flex:0 0 auto; display:inline-flex; align-items:center; gap:1px; }
  .regnum{ font-size:13px; color:var(--ink-ghost); font-weight:600; }
  .regnum-open{ font-family:var(--mono); background:transparent; border:none; cursor:pointer; padding:2px 6px; border-radius:6px; min-width:30px; text-align:center; transition: background .14s, color .14s; }
  .regnum-open:hover{ background: var(--accent-wash); color: var(--accent-ink); }
  .regnum-pen{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; padding:0; border:none; background:transparent; color:var(--ink-ghost); cursor:pointer; border-radius:5px; opacity:0; transition: opacity .14s, color .14s, background .14s; }
  .regnum-pen svg{ width:12px; height:12px; }
  .reghead:hover .regnum-pen, .regcard-head:hover .regnum-pen{ opacity:1; }
  .regnum-pen:hover{ color:var(--accent-ink); background:var(--accent-wash); }
  .regnum-edit{ flex:0 0 auto; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent-ink); width:48px; border:1px solid var(--accent-line); border-radius:7px; padding:3px 6px; outline:none; background:var(--paper); }

  .reghead-main{ flex:1; min-width:0; display:flex; align-items:baseline; gap:12px; }
  .regname{ font-size:19px; font-weight:500; color:var(--ink); letter-spacing:-0.01em; line-height:1.2; flex:0 0 auto; }
  .reglead{ font-size:14px; color:var(--ink-faint); line-height:1.45; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .regcount{ font-size:13px; color:var(--ink-faint); flex:0 0 auto; }
  .regbody-wrap{ height:0; overflow:hidden; }
  .regbody-wrap[aria-hidden="true"]{ pointer-events:none; }
  .regbody-pad{ padding:2px 12px 18px 40px; }

  /* Variante B — Karten */
  .reggrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .regcard{ border:1px solid var(--line); border-radius:14px; padding:20px 20px 18px; cursor:pointer; background:var(--paper); transition: border-color .15s, transform .15s, box-shadow .15s; }
  .regcard:hover{ border-color:var(--accent-line); transform:translateY(-2px); box-shadow:0 14px 32px -20px oklch(0.4 0.05 250 / .5); }
  .regcard-head{ display:flex; align-items:baseline; gap:11px; margin-bottom:12px; }
  .regcard-head .regnum{ width:auto; padding-top:0; }
  .regcard-head .regname{ font-size:21px; flex:1; min-width:0; }
  .regcard-head .regcount{ align-self:baseline; }
  .regcard .reglead{ display:block; margin:0 0 14px; }

  /* Zettel-Trail (klickbare Adressen) */
  .regtrail{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:0 4px; margin-top:2px; }
  .reglist .regtrail{ padding-left:44px; }
  .regsep{ color:var(--ink-ghost); font-size:13px; }
  .regchip{ display:inline-flex; align-items:center; gap:4px; height:27px; padding:0 10px; border-radius:7px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--accent-ink); letter-spacing:-0.02em; transition: border-color .14s, background .14s, transform .14s; }
  .regchip:hover{ border-color:var(--accent-line); background:var(--accent-wash); transform:translateY(-1px); }
  .regchip.branch{ border-style:dashed; color:var(--ink-soft); }
  .regchip.branch .bsplit{ color:var(--ink-faint); }
  .regchip.more{ font-family:var(--sans); font-weight:600; color:var(--ink-faint); background:var(--panel-2); border-color:var(--line-soft); }
  .regchip.more:hover{ color:var(--ink); background:var(--panel); border-color:var(--line); transform:none; }
  .reglist .regtrail{ padding-left:44px; }
  @media (max-width: 760px){ .reggrid{ grid-template-columns:1fr; } }

  /* ===== Themen / Übersichtszettel (Hubs) ===== */
  .thsec{ margin-bottom:36px; }
  .thsec-head{ display:flex; align-items:center; justify-content:space-between; padding:0 4px 14px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .th-new{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; transition:color .14s, border-color .14s; }
  .th-new:hover{ color:var(--accent-ink); border-color:var(--accent-line); }
  .th-new svg{ width:14px; height:14px; }
  .th-empty{ font-size:14px; color:var(--ink-faint); line-height:1.5; background:var(--panel); border:1px dashed var(--line); border-radius:12px; padding:18px 20px; }
  .thaddr{ font-size:12px; font-weight:600; color:var(--accent-ink); letter-spacing:-0.02em; flex:0 0 auto; }
  .thtitle{ font-size:21px; font-weight:500; color:var(--ink); letter-spacing:-0.01em; line-height:1.12; }
  .thlead{ font-size:14.5px; color:var(--ink-faint); line-height:1.45; }
  .thcount{ font-size:12.5px; color:var(--ink-faint); flex:0 0 auto; }
  .thentries{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .th-more{ font-size:12px; color:var(--ink-faint); }
  .regchip.thema{ font-family:var(--sans); font-weight:600; color:var(--ink-soft); background:var(--panel-2); border-color:var(--line); }
  .regchip.thema:hover{ color:var(--accent-ink); border-color:var(--accent-line); background:var(--accent-wash); }
  .regchip.thema svg{ flex:0 0 auto; }

  /* Variante: Register (Listenkarten) */
  .thlist{ display:flex; flex-direction:column; gap:14px; }
  .thcard{ border:1px solid var(--line); border-radius:14px; background:var(--paper); padding:6px 18px 16px; transition:border-color .15s, box-shadow .15s; }
  .thcard:hover{ border-color:var(--accent-line); box-shadow:0 14px 32px -22px oklch(0.4 0.05 250 / .5); }
  .thcard-head{ display:flex; align-items:baseline; gap:16px; width:100%; text-align:left; background:transparent; border:none; padding:16px 0 12px; cursor:pointer; }
  .thcard-head .regchev{ flex:0 0 auto; align-self:center; color:var(--ink-ghost); display:inline-flex; transition:transform .16s, color .16s; }
  .thcard-head .regchev svg{ width:17px; height:17px; }
  .thcard-head:hover .regchev{ color:var(--accent-ink); transform:translateX(3px); }
  .thcard-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .thcard .thentries{ padding-top:4px; }

  /* Variante: Kacheln */
  .thgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .thtile{ border:1px solid var(--line); border-radius:14px; background:var(--paper); padding:18px 18px 16px; cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s; display:flex; flex-direction:column; gap:8px; }
  .thtile:hover{ border-color:var(--accent-line); transform:translateY(-2px); box-shadow:0 14px 32px -20px oklch(0.4 0.05 250 / .5); }
  .thtile-top{ display:flex; align-items:center; justify-content:space-between; }
  .thtile .thlead{ flex:1; }
  .thtile .thentries{ margin-top:4px; }
  @media (max-width: 760px){ .thgrid{ grid-template-columns:1fr; } }

  /* ===== Themen-Ansicht (Hub öffnen) ===== */
  .hubwrap{ position:absolute; inset:0; overflow-y:auto; }
  .hubinner{ max-width:760px; margin:0 auto; padding:40px 44px 96px; }
  .hub-back{ display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px 0 9px; border:1px solid var(--line); border-radius:9px; background:var(--paper); font:inherit; font-size:13px; font-weight:600; color:var(--ink-faint); cursor:pointer; margin-bottom:24px; transition:color .14s, border-color .14s; }
  .hub-back:hover{ color:var(--accent-ink); border-color:var(--accent-line); }
  .hub-card{ border:1px solid var(--line); border-radius:16px; background:var(--panel); padding:20px 24px 24px; box-shadow:0 1px 0 var(--line-soft); }
  .hub-cardtop{ display:flex; align-items:center; gap:10px; }
  .hub-addr{ font-size:14px; font-weight:600; color:var(--accent-ink); letter-spacing:-0.02em; }
  .hub-kind{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-ghost); }
  .hub-titel{ font-size:34px; font-weight:400; letter-spacing:-0.02em; color:var(--ink); line-height:1.08; margin:14px 0 0; text-wrap:pretty; }
  .hub-leit{ font-size:17px; color:var(--ink-soft); line-height:1.5; margin:12px 0 0; text-wrap:pretty; }
  .hub-titel-edit{ width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 13px; font-size:26px; font-weight:400; color:var(--ink); background:var(--paper); outline:none; letter-spacing:-0.01em; }
  .hub-titel-edit:focus{ border-color:var(--accent-line); }
  .hub-leit-edit{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 13px; margin-top:10px; font-size:16px; line-height:1.5; color:var(--ink-soft); background:var(--paper); outline:none; resize:none; }
  .hub-leit-edit:focus{ border-color:var(--accent-line); }
  .th-del{ color:oklch(0.52 0.16 25); border-color:oklch(0.82 0.07 25); }
  .th-del:hover{ color:oklch(0.46 0.18 25); border-color:oklch(0.66 0.16 25); background:oklch(0.96 0.03 25); }

  .hub-entries-head{ display:flex; align-items:baseline; justify-content:space-between; margin:34px 4px 14px; }
  .hub-entries{ display:flex; flex-direction:column; gap:10px; }
  .hub-entry{ display:flex; align-items:stretch; gap:10px; }
  .hub-entry-body{ flex:1; min-width:0; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s; }
  .hub-entry-body:hover{ border-color:var(--accent-line); transform:translateY(-1px); box-shadow:0 10px 26px -18px oklch(0.4 0.05 250 / .5); }
  .hub-entry.sub .hub-entry-body{ background:var(--panel); border-style:dashed; }
  .hub-entry-addr{ display:flex; align-items:center; gap:8px; color:var(--accent-ink); }
  .hub-entry-addr .mono{ font-size:13px; font-weight:600; letter-spacing:-0.02em; }
  .hub-subtag{ font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-ghost); }
  .hub-entry-text{ font-size:16px; line-height:1.46; color:var(--ink-soft); margin-top:6px; text-wrap:pretty; }
  .hub-ord{ display:flex; flex-direction:column; gap:4px; justify-content:center; flex:0 0 auto; }
  .hub-ord button{ width:26px; height:22px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink-faint); cursor:pointer; font-size:12px; line-height:1; transition:color .14s, border-color .14s; }
  .hub-ord button:hover:not(:disabled){ color:var(--accent-ink); border-color:var(--accent-line); }
  .hub-ord button:disabled{ opacity:.35; cursor:default; }
  .hub-rm{ flex:0 0 auto; align-self:center; width:30px; height:30px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink-ghost); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:color .14s, border-color .14s, background .14s; }
  .hub-rm:hover{ color:oklch(0.52 0.16 25); border-color:oklch(0.74 0.1 25); background:oklch(0.97 0.02 25); }
  .hub-rm svg{ width:14px; height:14px; }
  .hub-add{ display:inline-flex; align-items:center; gap:7px; height:42px; padding:0 16px; margin-top:14px; border:1px dashed var(--line); border-radius:12px; background:transparent; font:inherit; font-size:14px; font-weight:600; color:var(--ink-faint); cursor:pointer; transition:color .14s, border-color .14s; }
  .hub-add:hover{ color:var(--accent-ink); border-color:var(--accent-line); }
  .hub-add svg{ width:16px; height:16px; }

  /* ===== Themen-Einstieg (A · Luhmann-treu) — Schwelle, kein Kasten ===== */
  .thm-thresh{ display:flex; align-items:center; gap:13px; padding:2px 0 10px; }
  .thm-eyebrow{ font-size:10px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; color:var(--accent-ink); flex:0 0 auto; }
  .thm-title{ font-family:var(--serif); font-size:18px; font-weight:500; color:var(--ink); letter-spacing:-0.012em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 auto; }
  .thm-flex{ flex:1 1 auto; }
  .thm-ptr{ display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; }
  .thm-ptrlabel{ font-size:11px; color:var(--ink-faint); letter-spacing:.02em; }
  .thm-addr{ font-family:var(--mono); font-size:14px; font-weight:600; color:var(--accent-ink); }
  .thm-vline{ width:1px; height:18px; background:var(--line); flex:0 0 auto; }
  .thm-actions{ display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .thm-ghost{ width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--ink-ghost); cursor:pointer; transition:.14s; }
  .thm-ghost:hover{ color:var(--accent-ink); border-color:var(--accent-line); }
  .thm-ghost svg{ width:14px; height:14px; }
  .thm-rule{ height:2px; background:linear-gradient(90deg, var(--accent) 0 72px, var(--accent-line) 72px 96px, var(--line) 96px); border-radius:2px; }
  .thm-alts{ display:flex; align-items:center; gap:10px; padding-left:2px; flex-wrap:wrap; }
  .thm-altlabel{ font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
  .thm-door{ display:inline-flex; align-items:center; height:25px; padding:0 11px; border:1px solid var(--accent-line); border-radius:0 0 7px 7px; border-top:none; background:var(--accent-wash); font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent-ink); cursor:pointer; position:relative; top:-1px; transition:.14s; }
  .thm-door:hover{ background:oklch(0.52 0.105 250 / 0.16); }
  .thm-door.cur{ background:var(--accent); color:var(--paper); border-color:var(--accent); cursor:default; }
  .thm-door-add{ border-style:dashed; border-color:var(--ink-ghost); background:transparent; color:var(--ink-faint); font-family:var(--sans); font-weight:500; }
  .thm-door-add:hover{ color:var(--accent-ink); border-color:var(--accent-line); background:transparent; }

  /* eingeklappte Spur — wenn man im Thema weitergelesen hat */
  .thm-trace{ display:flex; align-items:center; gap:11px; padding:4px 4px 2px; }
  .thm-tracedot{ width:7px; height:7px; border-radius:50%; border:1.5px solid var(--accent); flex:0 0 auto; }
  .thm-tracelbl{ font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); flex:0 0 auto; }
  .thm-traceback{ font-family:var(--serif); font-size:15px; color:var(--ink-soft); background:none; border:none; padding:0; cursor:pointer; letter-spacing:-0.01em; text-align:left; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .14s; flex:1 1 auto; }
  .thm-traceback:hover{ color:var(--accent-ink); }
  .thm-tracehint{ font-size:11px; color:var(--ink-ghost); flex:0 0 auto; }

  /* ===== Zettel-Kopf: ruhige Metazeile (feste Stelle · Reihe) ===== */
  .z-head{ display:flex; align-items:center; gap:9px; margin-bottom:2px; }
  .z-addr{ font-family:var(--mono); font-size:14px; font-weight:600; color:var(--ink-soft); letter-spacing:-0.01em; }
  .z-sep{ color:var(--ink-ghost); font-size:13px; }
  .z-reihe{ font-size:12.5px; color:var(--ink-faint); letter-spacing:.01em; }
  .editbtn-quiet{ opacity:0; transition:opacity .16s; }
  .z-head:hover .editbtn-quiet, .editbtn-quiet:focus-visible{ opacity:1; }

  /* ===== Verweisapparat am Zettel-Fuß ===== */
  /* ===== Verweise als interne @-Links (Textform) am Zettel-Fuß ===== */
  .z-refs{ display:flex; align-items:baseline; gap:11px; margin-top:28px; padding-top:18px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .z-refs-lead{ font-family:var(--serif); font-size:14px; font-style:italic; color:var(--ink-faint); flex:0 0 auto; }
  .z-refs-list{ display:inline-flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .z-at{ font-family:var(--mono); font-size:13.5px; font-weight:600; color:var(--accent-ink); background:none; border:none; padding:0; cursor:pointer; border-bottom:1px solid var(--accent-line); transition:border-color .14s, color .14s; }
  .z-at:hover{ color:var(--accent); border-color:var(--accent); }
  /* interne @-Verweise inline im Zetteltext */
  .z-at-inline{ font-family:var(--mono); font-size:0.92em; font-weight:600; color:var(--accent-ink); background:var(--accent-wash); border:none; padding:0 4px; border-radius:5px; cursor:pointer; transition:background .14s; }
  .z-at-inline:hover{ background:oklch(0.52 0.105 250 / 0.2); }
  /* Hover-Vorschau eines verlinkten Zettels */
  .z-preview{ position:fixed; width:300px; max-width:78vw; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 50px -24px oklch(0.4 0.05 260 / .6); padding:13px 15px; z-index:80; pointer-events:none; opacity:0; transform:translateY(3px); transition:opacity .13s ease, transform .13s ease; }
  .z-preview.on{ opacity:1; transform:translateY(0); }
  .z-preview-head{ display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .z-preview-addr{ font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent-ink); background:var(--accent-wash); padding:1px 6px; border-radius:5px; }
  .z-preview-body{ font-size:13.5px; line-height:1.5; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .z-preview-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .z-preview-tag{ font-size:11px; color:var(--ink-faint); background:var(--panel-2); padding:1px 7px; border-radius:20px; }
  /* @-Suchmaske (Index oder Inhalt, mehrere Wörter) — über oder unter dem Feld */
  .atmenu{ position:absolute; left:-6px; right:-6px; background:var(--paper); border:1px solid var(--line); border-radius:11px; box-shadow:0 18px 44px -22px oklch(0.4 0.05 260 / .55); padding:6px; z-index:20; }
  .atmenu-top{ bottom:calc(100% + 8px); }
  .atmenu-bottom{ top:calc(100% + 8px); }
  .atmenu-input{ width:100%; border:none; outline:none; background:var(--panel-2); border-radius:7px; padding:8px 10px; font:inherit; font-size:13px; color:var(--ink); margin-bottom:6px; }
  .atmenu-input::placeholder{ color:var(--ink-ghost); }
  .atmenu-list{ display:flex; flex-direction:column; max-height:208px; overflow-y:auto; }
  .atmenu-row{ display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:none; border:none; padding:7px 8px; border-radius:7px; cursor:pointer; transition:background .12s; }
  .atmenu-row.on{ background:var(--panel-2); }
  .atmenu-id{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent-ink); flex:0 0 auto; }
  .atmenu-txt{ font-size:12.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .atmenu-empty{ font-size:12.5px; color:var(--ink-ghost); font-style:italic; padding:8px; }

  /* Thema als Rückverweis am Fuß */
  .z-backlink{ display:flex; align-items:center; gap:8px; margin-top:22px; padding-top:15px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-faint); flex-wrap:wrap; }
  .z-backlink svg{ width:13px; height:13px; color:var(--ink-ghost); flex:0 0 auto; }
  .z-bllink{ font-style:italic; color:var(--ink-soft); background:none; border:none; padding:0; cursor:pointer; font-size:12px; transition:color .14s; }
  .z-bllink:hover{ color:var(--accent-ink); }

  /* ---------- Rückverweise (eingehende Querverweise) — drei Konzepte ---------- */
  /* gemeinsamer @-Chip mit Hover-Vorschau */
  .bl-chip{ font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink-faint); background:none; border:none; padding:1px 4px; border-radius:5px; cursor:pointer; transition:color .14s, background .14s; }
  .bl-chip:hover{ color:var(--accent-ink); background:var(--accent-wash); }

  /* Konzept 1 — stille Fußzeile: dezenter als Belege, gestrichelte Trennung */
  .bl-foot{ display:flex; align-items:center; gap:8px; margin-top:18px; padding-top:14px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-faint); flex-wrap:wrap; }
  .bl-foot svg{ width:13px; height:13px; color:var(--ink-ghost); flex:0 0 auto; }
  .bl-foot-lead{ color:var(--ink-faint); }
  .bl-foot-list{ display:flex; align-items:center; gap:2px; flex-wrap:wrap; }

  /* Konzept 2 — Marginalie: Glosse im Randton, Serif-Kursiv, vertikaler Akzent */
  .bl-marg{ display:flex; align-items:baseline; gap:10px; margin-top:20px; padding-left:13px; border-left:2px solid var(--accent-line); flex-wrap:wrap; }
  .bl-marg-lead{ font-family:var(--serif); font-style:italic; font-size:13px; color:var(--ink-soft); flex:0 0 auto; }
  .bl-marg-list{ display:flex; align-items:center; gap:3px; flex-wrap:wrap; }

  /* Konzept 3 — Sammelmarke: eingeklappt, öffnet bei Hover/Klick */
  .bl-mark{ position:relative; margin-top:18px; }
  .bl-mark-toggle{ display:inline-flex; align-items:center; gap:7px; background:none; border:none; padding:3px 0; cursor:pointer; font-size:12px; color:var(--ink-faint); transition:color .14s; }
  .bl-mark-toggle:hover{ color:var(--accent-ink); }
  .bl-mark-toggle svg{ width:13px; height:13px; color:var(--ink-ghost); flex:0 0 auto; }
  .bl-mark.open .bl-mark-toggle{ color:var(--accent-ink); }
  .bl-mark-pop{ position:absolute; left:-10px; top:calc(100% + 6px); width:330px; max-width:80vw; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 50px -24px oklch(0.4 0.05 260 / .6); padding:9px; z-index:40; }
  /* unsichtbare Brücke über die Lücke zwischen Marke und Popover — hält den Hover */
  .bl-mark-pop::before{ content:""; position:absolute; left:0; right:0; top:-8px; height:8px; }
  .bl-mark-lead{ display:block; font-size:11px; color:var(--ink-ghost); padding:4px 8px 7px; }
  .bl-mark-rows{ display:flex; flex-direction:column; }
  .bl-mark-row{ display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:none; border:none; padding:7px 8px; border-radius:8px; cursor:pointer; transition:background .12s; }
  .bl-mark-row:hover{ background:var(--panel-2); }
  .bl-mark-addr{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--accent-ink); flex:0 0 auto; }
  .bl-mark-txt{ font-family:var(--serif); font-size:13.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }

  /* ===== Themen-Editor (Modal) ===== */
  .hubmodal{ width:min(620px, 95vw); max-height:84vh; background:var(--paper); border-radius:16px; box-shadow:0 40px 90px -30px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; }
  .hubmodal-head{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); }
  .hubmodal-body{ padding:18px 20px 6px; overflow-y:auto; }
  .hubmodal-body .hub-titel-edit{ font-size:24px; }
  .hubmodal-body .hub-entries-head{ margin:22px 2px 12px; }
  .hubmodal-foot{ display:flex; align-items:center; gap:11px; padding:13px 18px; border-top:1px solid var(--line); }
  .hub-open-hint{ font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-ghost); margin-left:8px; opacity:0; transition:opacity .14s; }
  .hub-entry-body:hover .hub-open-hint{ opacity:1; color:var(--accent-ink); }
  .pick-group{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-ghost); padding:8px 13px 4px; }
  .pick-hint{ font-size:12.5px; line-height:1.5; color:var(--ink-faint); padding:11px 18px; background:var(--accent-wash); border-bottom:1px solid var(--line); text-wrap:pretty; }

  /* ===== Themen je Reihe — prominent, über den einzelnen Zetteln ===== */
  .reihethemen{ display:flex; flex-direction:column; gap:5px; margin:8px 0 4px; padding-left:44px; }
  .reggrid .reihethemen{ padding-left:0; margin-top:12px; }
  .rthema{ display:flex; align-items:baseline; gap:13px; border:0; border-radius:4px; background:transparent; padding:5px 7px 6px 4px; cursor:pointer; transition:background .14s; }
  .rthema:hover{ background:oklch(0.975 0.004 60); box-shadow:none; transform:none; }
  .rthema-num{ flex:0 0 auto; width:18px; text-align:right; font-size:12px; font-weight:500; color:var(--ink-ghost); font-variant-numeric:tabular-nums; line-height:1.32; }
  .rthema:hover .rthema-num{ color:var(--accent-ink); }
  .rthema-main{ flex:1; min-width:0; }
  .rthema-line{ display:flex; align-items:baseline; gap:8px; }
  .rthema-titel{ font-size:14.5px; font-weight:500; color:var(--ink); letter-spacing:-0.01em; line-height:1.3; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rthema-leader{ flex:1 1 auto; min-width:16px; align-self:flex-end; border-bottom:1px dotted var(--line); margin-bottom:4px; }
  .rthema-pg{ flex:0 0 auto; font-size:11.5px; font-weight:500; color:var(--ink-faint); font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .rthema-pgmore{ font-style:normal; color:var(--ink-ghost); }
  .rthema-leit{ font-size:12.5px; color:var(--ink-faint); line-height:1.35; margin-top:1px; text-wrap:pretty; }
  .rthema.kompakt{ padding:3px 7px 3px 4px; }
  .th-new-mini{ align-self:stretch; display:flex; align-items:baseline; gap:13px; margin-top:3px; padding:5px 7px 6px 4px; border:0; border-radius:4px; background:transparent; font:inherit; font-size:13px; font-weight:500; color:var(--ink-ghost); cursor:pointer; transition:color .14s, background .14s; }
  .th-new-mini::before{ content:"+"; flex:0 0 auto; width:18px; text-align:right; font-size:13px; font-weight:500; color:var(--ink-ghost); line-height:1.3; transition:color .14s; }
  .th-new-mini > span{ font-weight:500; }
  .th-new-mini:hover{ color:var(--accent-ink); background:oklch(0.975 0.004 60); }
  .th-new-mini:hover::before{ color:var(--accent-ink); }
  .th-new-mini svg{ display:none; }

  /* einzelne Zettel — sekundär, gedämpft unter den Themen */
  .reg-einzel{ display:flex; align-items:baseline; gap:10px; margin-top:14px; padding-left:44px; }
  .reggrid .reg-einzel{ padding-left:0; flex-direction:column; gap:6px; }
  .reg-einzel-label{ font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-ghost); flex:0 0 auto; padding-top:5px; }
  .reg-einzel .regtrail{ padding-left:0; opacity:.78; }
  .reg-einzel .regchip{ font-size:11.5px; height:23px; }
  .hub-reihe{ font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--ink-faint); padding:2px 9px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; flex:0 0 auto; }
  @media (max-width: 760px){ .reihethemen, .reg-einzel{ padding-left:0; } }

  /* ===== Quellen / Highlights / Werkbank ===== */
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .ovinner-wide{ max-width:920px; }
  .reldot.beleg{ background: oklch(0.62 0.10 35); }

  /* Quell-Symbol */
  .smark{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; flex:0 0 30px; border-radius:8px; background: var(--panel-2); color: var(--ink-soft); }
  .smark svg{ width:17px; height:17px; }
  .smark-book{ background: oklch(0.93 0.04 250); color: oklch(0.42 0.10 250); }
  .smark-essay{ background: oklch(0.93 0.045 150); color: oklch(0.40 0.09 150); }
  .smark-article{ background: oklch(0.94 0.05 60); color: oklch(0.45 0.10 60); }

  /* Readwise-Verbindung */
  .rwpanel{ border:1px solid var(--line); border-radius:15px; background: var(--panel); padding:16px 18px; margin-bottom:26px; }
  .rwhead{ display:flex; align-items:center; gap:13px; }
  .rwmark{ display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background: oklch(0.45 0.13 25 / 0.12); color: oklch(0.52 0.16 25); }
  .rwmark svg{ width:20px; height:20px; }
  .rwid{ flex:1; min-width:0; }
  .rwtitle{ font-weight:700; font-size:14.5px; color: var(--ink); display:flex; align-items:center; gap:7px; }
  .rwdot{ width:7px; height:7px; border-radius:50%; background: oklch(0.72 0.16 150); }
  .rwconn{ font-size:12px; font-weight:600; color: oklch(0.52 0.12 150); }
  .rwsub{ font-size:12.5px; color: var(--ink-faint); margin-top:1px; }
  .rwgear{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--paper); color:var(--ink-faint); cursor:pointer; transition:color .15s, border-color .15s; }
  .rwgear:hover{ color:var(--ink); border-color:var(--accent-line); }
  .rwgear svg{ width:16px; height:16px; }
  .pill.is-busy{ opacity:.7; }
  .rwstats{ display:flex; gap:22px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-soft); font-size:13px; color:var(--ink-faint); flex-wrap:wrap; }
  .rwstats b{ color: var(--ink); font-weight:700; font-family:var(--mono); }
  .rwstats b.rwneu{ color: var(--accent-ink); }
  .rwsettings{ margin-top:15px; padding-top:14px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:13px; }
  .rwsetrow{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .rwsetlabel{ font-size:13.5px; color: var(--ink-soft); font-weight:500; }
  .rwchoices{ display:flex; gap:7px; flex-wrap:wrap; }
  .choice{ display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 11px; border-radius:7px; border:1px solid var(--line); background:var(--paper); font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; transition:all .14s; }
  .choice.on{ border-color: var(--accent-line); background: var(--accent-wash); color: var(--accent-ink); }
  .switch{ width:42px; height:24px; border-radius:999px; border:none; background: var(--line); cursor:pointer; padding:0; position:relative; transition: background .18s; flex:0 0 auto; }
  .switch.on{ background: var(--accent); }
  .switch .knob{ position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition: left .18s; }
  .switch.on .knob{ left:21px; }
  .rwnote{ font-size:12px; color: var(--ink-ghost); line-height:1.5; }

  /* Filter-Tabs */
  .qfilter{ display:flex; gap:4px; margin-bottom:18px; }
  .qtab{ display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:9px; border:none; background:transparent; font:inherit; font-size:13.5px; font-weight:600; color: var(--ink-faint); cursor:pointer; transition: background .15s, color .15s; }
  .qtab:hover{ color: var(--ink); background: var(--panel-2); }
  .qtab.on{ background: var(--ink); color: var(--paper); }
  .qcount{ font-family:var(--mono); font-size:11.5px; opacity:.8; }
  .qempty{ font-size:14px; color: var(--ink-faint); padding:30px 4px; }

  /* Quellen-Gruppen */
  .qsources{ display:flex; flex-direction:column; gap:30px; }
  .qsource-head{ display:flex; align-items:center; gap:12px; margin-bottom:13px; }
  .qsource-id{ flex:1; min-width:0; }
  .qsource-title{ font-size:18px; font-weight:500; color: var(--ink); }
  .qsource-meta{ font-size:12.5px; color: var(--ink-faint); margin-top:1px; }
  .qsource-count{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  .qsource-list{ display:flex; flex-direction:column; gap:8px; }
  .hlstream{ display:flex; flex-direction:column; gap:9px; }

  /* Bibliothek: Cover-Raster + Ebenen */
  .biblist{ display:flex; flex-direction:column; }
  .bibrow{ display:flex; align-items:center; gap:16px; padding:14px 12px; border-top:1px solid var(--line); cursor:pointer; border-radius:10px; outline:2px solid transparent; outline-offset:-2px; transition: background .14s, outline-color .14s; }
  .bibrow:first-child{ border-top:none; }
  .bibrow:hover{ background: var(--panel-2); }
  .bibrow.cursor{ outline-color: var(--accent); background: var(--panel-2); }
  .bibthumb{ position:relative; width:42px; height:56px; flex:0 0 42px; border-radius:6px; overflow:hidden; box-shadow:0 6px 14px -8px oklch(0.3 0.04 60 / .5); }
  .bibthumb::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background: var(--spine); }
  .bibrow-main{ flex:1; min-width:0; }
  .bibrow-title{ font-size:19px; font-weight:500; color:var(--ink); line-height:1.2; }
  .bibrow-meta{ font-size:12.5px; color:var(--ink-faint); margin-top:3px; }
  .bibrow-counts{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:12.5px; color:var(--ink-faint); flex:0 0 auto; white-space:nowrap; }
  .bibrow-counts .dot-neu{ color:var(--accent-ink); font-weight:600; }
  .bibrow-chev{ flex:0 0 auto; color:var(--ink-ghost); display:inline-flex; transition: transform .15s, color .15s; }
  .bibrow-chev svg{ width:17px; height:17px; }
  .bibrow:hover .bibrow-chev{ color:var(--accent-ink); transform:translateX(3px); }
  .bibgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(186px, 1fr)); gap:26px 22px; }
  .srccard{ cursor:pointer; border-radius:14px; outline:2px solid transparent; outline-offset:4px; transition: outline-color .15s, transform .18s; }
  .srccard:hover{ transform:translateY(-3px); }
  .srccard.cursor{ outline-color: var(--accent); }
  .srccover{ position:relative; aspect-ratio:3/4; border-radius:12px; padding:18px 18px 16px 24px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; box-shadow:0 18px 36px -20px oklch(0.3 0.04 60 / .55); }
  .srccover::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:7px; background: var(--spine); opacity:.9; }
  .srccover-kind{ font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
  .srccover-title{ font-size:21px; line-height:1.16; font-weight:500; text-wrap:pretty; }
  .srccover-author{ font-size:12.5px; margin-top:7px; opacity:.85; }
  .srccover-year{ position:absolute; right:15px; bottom:13px; font-size:11px; opacity:.55; }
  .srcmeta{ display:flex; align-items:center; gap:7px; margin-top:12px; font-size:12.5px; color:var(--ink-faint); }
  .srcmeta .dot-neu{ color:var(--accent-ink); font-weight:600; }

  .biblevel-head{ display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .backbtn{ display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px 0 11px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition: border-color .15s, color .15s; }
  .backbtn:hover{ border-color: var(--accent-line); color: var(--ink); }
  .backbtn svg{ width:15px; height:15px; }
  .bibcrumb{ font-size:12.5px; color: var(--ink-ghost); }
  .bibcrumb-l{ cursor:pointer; }
  .bibcrumb-l:hover{ color: var(--accent-ink); }

  .qsource-head-lg{ align-items:flex-start; gap:20px; margin-bottom:22px; }
  .qsource-head-lg .srccover{ width:104px; flex:0 0 104px; padding:14px 12px 12px 18px; }
  .qsource-head-lg .srccover-title{ font-size:15px; line-height:1.14; }
  .qsource-head-lg .srccover-author{ font-size:10px; margin-top:4px; }
  .qsource-head-lg .srccover-kind{ font-size:8.5px; }
  .qsource-head-lg .srccover-year{ display:none; }
  .qsource-head-lg .qsource-title{ font-size:27px; }
  .qsource-stat{ font-size:13px; color:var(--ink-faint); margin-top:8px; }

  .hlopen{ display:inline-flex; color: var(--ink-ghost); transition: transform .15s, color .15s; }
  .hlopen svg{ width:16px; height:16px; }
  .hl{ position:relative; }
  .hl:hover .hlopen{ color: var(--accent-ink); transform: translateX(2px); }
  .hl.cursor{ outline:2px solid var(--accent); outline-offset:2px; border-color: var(--accent-line); }
  .hlcheck{ padding:0; cursor:pointer; background:transparent; }

  .hldetail{ max-width:680px; }
  .hldetail-q{ font-family:var(--serif); font-size:27px; line-height:1.42; color:var(--ink); margin:8px 0 0; text-wrap:pretty; }
  .hldetail-src{ display:flex; align-items:center; gap:11px; margin-top:24px; font-size:14.5px; color:var(--ink-soft); }
  .hldetail-meta{ display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-faint); }
  .hldetail-actions{ display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; }

  .bibhint{ display:flex; gap:18px; margin-top:30px; padding-top:18px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--ink-ghost); }
  .bibhint .kbd{ margin-right:5px; }

  /* Highlight-Karte */
  .hl{ display:flex; gap:13px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; background: var(--paper); padding:14px 16px; cursor:pointer; transition: border-color .15s, background .15s, box-shadow .15s; }
  .hl:hover{ border-color: var(--accent-line); box-shadow:0 8px 22px -16px oklch(0.4 0.05 250 / .45); }
  .hl.sel{ border-color: var(--accent); background: var(--accent-wash); }
  .hl.done{ opacity:.78; }
  .hlcheck{ flex:0 0 20px; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--ink-ghost); display:inline-flex; align-items:center; justify-content:center; color:#fff; margin-top:2px; transition: background .15s, border-color .15s; }
  .hl.sel .hlcheck{ background: var(--accent); border-color: var(--accent); }
  .hlbody{ flex:1; min-width:0; }
  .hlsrc{ display:flex; align-items:center; gap:7px; margin-bottom:7px; font-size:12px; color: var(--ink-faint); }
  .hlsrc .smark{ width:22px; height:22px; flex-basis:22px; }
  .hlsrc .smark svg{ width:13px; height:13px; }
  .hlsrc-t{ font-weight:600; color: var(--ink-soft); }
  .hltext{ font-size:16.5px; line-height:1.5; color: var(--ink); margin:0; text-wrap:pretty; }
  .hlmeta{ display:flex; align-items:center; gap:9px; margin-top:10px; font-size:12px; color: var(--ink-faint); flex-wrap:wrap; }
  .hlort{ font-family:var(--mono); }
  .hldot{ color: var(--ink-ghost); }
  .hltag{ height:20px; padding:0 8px; display:inline-flex; align-items:center; border-radius:5px; background: var(--panel-2); color: var(--ink-soft); font-size:11px; font-weight:500; }
  .hlstate{ font-size:11.5px; font-weight:600; color: var(--ink-ghost); border:1px solid var(--line); border-radius:6px; padding:2px 8px; }
  .hlstate.done{ display:inline-flex; align-items:center; gap:5px; color: oklch(0.46 0.10 150); border-color: oklch(0.85 0.06 150); background: oklch(0.96 0.03 150); cursor:pointer; }

  /* Auswahl-Leiste */
  .selbar{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; background: var(--paper); border:1px solid var(--line); border-radius:14px; padding:11px 14px 11px 18px; box-shadow:0 20px 50px -20px rgba(0,0,0,.35); z-index:45; }
  .selbar-n{ font-size:13.5px; font-weight:600; color: var(--ink); }

  /* Werkbank & Picker (Overlay) */
  .wkscrim{ position:fixed; inset:0; background: oklch(0.3 0.02 60 / 0.32); backdrop-filter: blur(2px); z-index:60; display:flex; align-items:center; justify-content:center; padding:40px; animation: fade .2s; }
  .wk{ width:min(940px, 96vw); max-height:88vh; background: var(--paper); border-radius:18px; box-shadow:0 40px 90px -30px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; }
  .wk-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--line); }
  .wk-title{ font-size:21px; font-weight:500; color:var(--ink); margin-top:3px; }
  .wk-body{ display:grid; grid-template-columns: 1fr 1fr; min-height:0; flex:1; }
  .wk-sources{ padding:22px 24px; border-right:1px solid var(--line); background: var(--panel); overflow-y:auto; }
  .wk-collabel{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:14px; }
  .wk-hl{ position:relative; border-left:2px solid var(--accent-line); padding:2px 0 2px 15px; margin-bottom:18px; }
  .wk-hl p{ font-size:16px; line-height:1.5; color:var(--ink); margin:0; text-wrap:pretty; }
  .wk-hlmeta{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12px; color:var(--ink-faint); }
  .wk-hlmeta .smark{ width:20px; height:20px; flex-basis:20px; } .wk-hlmeta .smark svg{ width:12px; height:12px; }
  .wk-rm{ position:absolute; top:0; right:0; width:24px; height:24px; border-radius:6px; border:none; background:transparent; color:var(--ink-ghost); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .wk-rm:hover{ color:var(--ink); background:var(--panel-2); }
  .wk-write{ padding:22px 24px; display:flex; flex-direction:column; min-height:0; }
  .wk-textarea{ flex:1; min-height:170px; border:1px solid var(--line); border-radius:12px; padding:16px; font-size:19px; line-height:1.55; color:var(--ink); resize:none; outline:none; background:var(--paper); }
  .wk-textarea:focus{ border-color: var(--accent-line); }
  .wk-foot{ display:flex; align-items:center; gap:12px; margin-top:14px; }
  .wk-reihe{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--ink-faint); }
  .wk-reihe input{ height:34px; border:1px solid var(--line); border-radius:8px; padding:0 11px; font:inherit; font-size:13px; color:var(--ink); outline:none; background:var(--paper); width:150px; }
  .wk-reihe input:focus{ border-color:var(--accent-line); }
  .wk-hint{ font-size:12px; color: var(--ink-ghost); margin-top:11px; line-height:1.5; }

  .picker{ width:min(640px, 95vw); max-height:80vh; background:var(--paper); border-radius:16px; box-shadow:0 40px 90px -30px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; }
  .picker-head{ display:flex; align-items:center; gap:11px; padding:16px 18px; border-bottom:1px solid var(--line); }
  .picker-input{ flex:1; border:none; outline:none; background:transparent; font:inherit; font-size:15px; color:var(--ink); }
  .picker-list{ overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .pick-hl{ display:flex; gap:12px; align-items:flex-start; padding:12px 13px; border-radius:10px; border:1px solid transparent; cursor:pointer; transition: background .14s, border-color .14s; }
  .pick-hl:hover{ background: var(--panel-2); }
  .pick-hl.sel{ background: oklch(0.955 0.035 250); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .pick-hl.sel .hlcheck{ background: var(--accent); border-color: var(--accent); }
  .pick-hl.sel p{ color: var(--ink); font-weight: 500; }
  .pick-hl p{ font-size:15px; line-height:1.45; color:var(--ink); margin:0; }
  .pick-hl .hlcheck{ margin-top:1px; }
  .picker-foot{ display:flex; align-items:center; gap:11px; padding:13px 18px; border-top:1px solid var(--line); }

  /* Belege als Fußnoten */
  /* Belege — stille Fußnoten (Konzept A · Stiller Apparat) */
  .belege-lean{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line-soft); }
  .bl-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .bl-fn{ display:flex; gap:11px; align-items:baseline; }
  .bl-n{ flex:0 0 auto; font-size:11px; font-weight:600; color:var(--accent-ink); line-height:1.5; }
  .bl-text{ flex:1; min-width:0; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .bl-q{ font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.5; color:var(--ink-soft); text-wrap:pretty; }
  .bl-text:hover .bl-q{ color:var(--ink); }
  .bl-src{ font-size:12.5px; color:var(--ink-faint); }
  .bl-src::before{ content:"— "; color:var(--ink-ghost); }
  .bl-rm{ flex:0 0 auto; width:22px; height:22px; border:none; background:transparent; color:var(--ink-ghost); cursor:pointer; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; transition:color .14s, background .14s; }
  .bl-rm:hover{ color:var(--ink); background:var(--panel-2); }
  .bl-add{ display:inline-flex; align-items:center; gap:5px; margin-top:14px; border:none; background:transparent; padding:0; font:inherit; font-size:12.5px; font-weight:500; color:var(--ink-faint); cursor:pointer; transition:color .14s; }
  .bl-add:hover{ color:var(--accent-ink); }

  /* Markdown-Vorschau-Modal */
  .mdmodal{ width:min(680px, 95vw); max-height:86vh; background:var(--paper); border-radius:16px; box-shadow:0 40px 90px -30px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; }
  .mdfile{ display:flex; align-items:center; gap:8px; padding:12px 24px; border-bottom:1px solid var(--line-soft); color:var(--ink-faint); font-size:12.5px; }
  .mdfile svg{ width:15px; height:15px; flex:0 0 15px; }
  .mdpre{ margin:0; padding:20px 24px; overflow:auto; font-family:var(--mono); font-size:12.5px; line-height:1.65; color:var(--ink); white-space:pre-wrap; word-break:break-word; background:var(--panel); flex:1; }
  .mdfoot{ display:flex; align-items:center; gap:10px; padding:14px 24px; border-top:1px solid var(--line); }
  .vaultinput{ height:32px; border:1px solid var(--line); border-radius:8px; padding:0 11px; font-size:12.5px; color:var(--ink); outline:none; background:var(--paper); width:190px; }
  .vaultinput:focus{ border-color: var(--accent-line); }
  .vaulthint{ font-size:12px; color: var(--ink-ghost); line-height:1.5; margin-top:-4px; }
  .rwsave{ display:flex; align-items:center; gap:13px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .rwsave-ic{ color: var(--ink-faint); display:inline-flex; flex:0 0 auto; }
  .rwsave-ic svg{ width:18px; height:18px; }
  .rwsave-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .rwsave-label{ font-size:12.5px; font-weight:600; color: var(--ink-soft); }
  .rwsave .vaultinput{ width:100%; max-width:300px; }
  .rwsave-auto{ font-size:12.5px; color: var(--ink-faint); flex:0 0 auto; }

  /* angeheftete Belege im Schreiben-Modus */
  .pendchip{ display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 6px 0 9px; border-radius:7px; background: var(--accent-wash); border:1px solid var(--accent-line); font-size:12px; font-weight:600; color: var(--accent-ink); }
  .pendchip button{ display:inline-flex; border:none; background:transparent; color:var(--accent-ink); cursor:pointer; padding:2px; opacity:.7; }
  .pendchip button:hover{ opacity:1; }

  /* ===== Schreiben-Konzepte ===== */
  .schreibcol-scroll{ height:100%; overflow-y:auto; scrollbar-gutter:stable; padding: clamp(40px,7vh,84px) clamp(40px,7vw,90px); }
  .schreibcol{ width:100%; max-width:660px; margin:0 auto; display:flex; flex-direction:column; }
  .backpill{ align-self:flex-start; height:32px; font-size:12.5px; white-space:nowrap; margin-bottom:4px; }

  .composer{ display:flex; flex-direction:column; }
  .composer-card{ background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:15px 16px; }
  .composer-head{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:10px; }
  .composer-belege{ display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:2px 0 12px; }
  .composer-ta{ width:100%; border:none; outline:none; resize:none; background:transparent; color:var(--ink); font-family:var(--serif); font-size:20px; line-height:1.5; min-height:60px; }
  .composer-ta::placeholder{ color:var(--ink-ghost); font-style:italic; }
  .composer-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .composer-hint{ font-size:11.5px; color:var(--ink-ghost); }

  /* Konzept Anbau */
  .anbau-connector{ display:flex; align-items:center; gap:11px; margin:24px 0 12px; }
  .anbau-line{ width:2px; height:26px; background:var(--accent-line); border-radius:2px; margin-left:2px; flex:0 0 auto; }
  .anbau-lbl{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-faint); letter-spacing:.02em; }
  .anbau-lbl svg{ color:var(--ink-ghost); }
  .anbau-connector + .composer .composer-head{ display:none; }

  /* Konzept Werkstatt */
  .schreibcol.werkstatt{ max-width:680px; }
  .wk-source{ margin:18px 0 26px; padding:13px 18px; border-left:3px solid var(--accent-line); background:var(--panel-2); border-radius:0 10px 10px 0; }
  .wk-source-lbl{ display:block; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; }
  .wk-source-text{ font-size:16px; line-height:1.55; color:var(--ink-soft); margin:0; }
  .schreibcol.werkstatt .composer-ta{ font-size:25px; line-height:1.48; min-height:170px; }

  /* Konzept Gegenüber */
  .gegen{ display:flex; align-items:stretch; gap:14px; margin:20px 0 4px; }
  .gegen-card{ flex:1 1 0; min-width:0; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; }
  .gegen-card.neu{ border-color:var(--accent-line); box-shadow:0 14px 34px -24px oklch(0.4 0.05 250 / .5); }
  .gegen-tab{ font-size:12px; color:var(--ink-faint); margin-bottom:13px; }
  .gegen-tab .mono{ color:var(--ink-soft); font-weight:600; }
  .gegen-tab.neu .mono{ color:var(--accent-ink); }
  .gegen-link{ display:flex; align-items:center; color:var(--ink-ghost); flex:0 0 auto; }
  .gegen-link svg{ width:20px; height:20px; }
  .gegen-card.neu .composer-head{ display:none; }
  .gegen-card.neu .composer-ta{ min-height:140px; }
  @media (max-width: 820px){ .gegen{ flex-direction:column; } .gegen-link{ transform:rotate(90deg); align-self:center; } }

  /* Reply-Spur + Kontext-Zeile */
  .replytrail{ margin-top:30px; padding-top:18px; border-top:1px solid var(--line-soft); }
  .replytrail-item{ display:flex; align-items:baseline; gap:12px; width:100%; text-align:left; background:none; border:none; padding:9px 10px; margin:0 -10px; border-radius:9px; cursor:pointer; transition:background .12s; }
  .replytrail-item:hover{ background:var(--panel-2); }
  .replytrail-id{ font-size:12.5px; font-weight:600; color:var(--accent-ink); flex:0 0 auto; }
  .replytrail-txt{ font-size:14px; color:var(--ink-faint); line-height:1.45; min-width:0; }
  .ctxrow{ display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; margin-top:26px; padding-top:16px; border-top:1px solid var(--line-soft); }
  .ctxrow-hint{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-faint); }
  .ctxrow-id{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--accent-ink); background:none; border:none; cursor:pointer; padding:0; }
  .ctxrow-chip{ display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink-faint); background:var(--panel-2); border:none; padding:3px 9px; border-radius:20px; cursor:pointer; transition:color .14s; }
  .ctxrow-chip:hover{ color:var(--accent-ink); }

  /* KI-Vermutung */
  /* Luhm vermutet — stille Zeile (Konzept A · Stiller Apparat) */
  .ki-lean{ margin-top:16px; display:flex; flex-direction:column; gap:13px; }
  .ki-lean.sep{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line-soft); }
  .kil-wrap{ display:flex; flex-direction:column; gap:9px; }
  .kil{ display:flex; align-items:center; gap:9px; font-size:14px; color:var(--ink-faint); white-space:nowrap; }
  .kil-spark{ width:14px; height:14px; color:var(--ink-faint); flex:0 0 auto; }
  .kil-to{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--accent-ink); border:none; background:transparent; padding:0 1px; cursor:pointer; }
  .kil-to:hover{ text-decoration:underline; }
  .kil-why{ border:none; background:transparent; padding:0; font:inherit; font-size:13.5px; color:var(--accent-ink); cursor:pointer; }
  .kil-why:hover{ text-decoration:underline; }
  .kil-why:disabled{ color:var(--ink-faint); cursor:default; text-decoration:none; }
  .kil-acts{ margin-left:auto; display:flex; gap:3px; }
  .kil-ic{ width:27px; height:27px; border:none; background:transparent; color:var(--ink-ghost); border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:background .14s, color .14s; }
  .kil-ic:hover{ background:var(--panel-2); color:var(--ink); }
  .kil-ic.yes:hover{ color:oklch(0.46 0.10 150); }
  .kil-why-text{ display:flex; gap:8px; align-items:flex-start; padding-left:23px; font-size:13.5px; line-height:1.5; color:var(--ink-soft); font-family:var(--serif); font-style:italic; }
  .kil-why-text svg{ width:14px; height:14px; color:var(--ink-faint); flex:0 0 14px; margin-top:3px; }
  .kil-foot{ font-size:11.5px; color:var(--ink-ghost); margin-top:2px; line-height:1.5; }

  /* responsive: stack side column under content */
  .splitcol{ display:flex; min-height:0; height:100%; }
  @media (max-width: 900px){
    .splitcol{ flex-direction:column; overflow-y:auto; }
    .splitcol .reading{ padding:34px 30px !important; }
    .splitcol .sidecol{ width:auto !important; flex:none !important; border-left:none !important; border-top:1px solid var(--line) !important; }
  }

  /* ======================================================================
     KONZEPTENTWURF v2 — Optimierungen P1–P7
     ====================================================================== */

  /* P1 — Graph-Zentrumskarte: Formatierung erhalten, Länge per Clamp statt Kappen */
  .gc-clamp{ display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }

  /* Robustheit: Eingangsanimation nur als Slide (keine Opacity), damit Inhalt nie
     unsichtbar „einfriert", wenn ein Hintergrund-Iframe die Animation drosselt. */
  @keyframes fade2{ from{ transform: translateY(6px); } to{ transform: none; } }
  .fade{ animation: fade2 .32s cubic-bezier(.2,.7,.3,1) !important; }

  /* P3 — ruhige Aktionszeile + Überlauf-Menü */
  .z-actions{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .moremenu{ position:relative; display:inline-flex; }
  .act.act-more.on{ color:var(--accent-ink); background:var(--panel-2); }
  .moremenu-pop{ position:absolute; bottom:calc(100% + 8px); left:0; min-width:230px; background:var(--paper); border:1px solid var(--line); border-radius:11px; box-shadow:0 18px 44px -22px oklch(0.4 0.05 260 / .55); padding:6px; z-index:30; }
  .moremenu-row{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; padding:8px 9px; border-radius:8px; cursor:pointer; color:var(--ink); font:inherit; font-size:13.5px; transition:background .12s; }
  .moremenu-row:hover{ background:var(--panel-2); }
  .moremenu-ic{ display:inline-flex; color:var(--ink-faint); flex:0 0 auto; }
  .moremenu-ic svg{ width:15px; height:15px; }
  .moremenu-lbl{ flex:1; min-width:0; }
  .moremenu-hint{ font-size:10px; color:var(--ink-ghost); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }

  /* P6 — KI-Vermutung als leise Randnotiz, klar sekundär unter den Aktionen */
  .ki-aside{ margin-top:34px; padding-left:14px; border-left:2px solid var(--accent-line); }
  .ki-aside-lead{ display:flex; align-items:center; gap:7px; font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:11px; }
  .ki-aside-lead svg{ color:var(--accent-ink); flex:0 0 auto; }
  .ki-aside .kil-acts{ opacity:0; transition:opacity .15s; }
  .ki-aside .kil:hover .kil-acts, .ki-aside:hover .kil-acts, .ki-aside:focus-within .kil-acts{ opacity:1; }
  @media (hover: none){ .ki-aside .kil-acts{ opacity:1; } }

  /* P4 — Kompass lesbarer, eigene Beschriftung, weniger Lesebreite-Kosten */
  .nmap{ opacity:.82; }
  .nmap-label{ position:absolute; left:0; top:-104px; transform:translate(-50%,0); font-size:9.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-ghost); white-space:nowrap; }
  @media (min-width: 901px){ .lesen-reading{ padding-right: clamp(150px, 14vw, 280px) !important; } }

  /* P7 — leise, aber dauerhaft sichtbare Affordances (auch ohne Hover/Touch) */
  .editbtn-quiet{ opacity:.4; }
  .z-head:hover .editbtn-quiet, .editbtn-quiet:focus-visible{ opacity:1; }
  @media (hover: none){ .editbtn-quiet{ opacity:.7; } .nmap{ opacity:1; } .nmap .cmp-key{ opacity:.7 !important; } }

  /* P2 — Fünf-Beziehungen-Legende (in der Tastatur-Hilfe und im Welcome) */
  .help-rels{ margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
  .help-rels-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px 26px; margin-top:4px; }
  .help-rel{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft); }
  .help-rel em{ color:var(--ink-faint); font-style:normal; font-size:12px; }
  .help-rel .reldot{ transform:scale(1.25); flex:0 0 auto; }

  /* P2 — Erstkontakt: Willkommens-Overlay */
  .welcome-scrim{ position:fixed; inset:0; background:oklch(0.3 0.03 260 / 0.34); backdrop-filter:blur(3px); z-index:140; display:flex; align-items:center; justify-content:center; padding:24px; animation:cmdk-in .14s ease; overflow:auto; }
  .welcome{ position:relative; width:min(620px, 95vw); max-height:calc(100vh - 48px); overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:0 40px 100px -34px oklch(0.35 0.05 260 / .7); padding:38px 40px 30px; }
  .welcome-x{ position:absolute; top:18px; right:18px; }
  .welcome-logo{ font-size:46px; font-weight:400; letter-spacing:-0.02em; line-height:1; color:var(--ink); }
  .welcome-tag{ font-style:italic; font-size:18px; color:var(--ink-soft); margin-top:8px; }
  .welcome-lead{ font-family:var(--serif); font-size:17px; line-height:1.6; color:var(--ink); margin:22px 0 0; text-wrap:pretty; }
  .welcome-steps{ display:flex; flex-direction:column; gap:0; margin:26px 0 0; }
  .welcome-step{ display:flex; align-items:flex-start; gap:14px; padding:12px 0; border-top:1px solid var(--line-soft); }
  .welcome-step:first-child{ border-top:none; }
  .welcome-step-n{ flex:0 0 auto; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; background:var(--accent-wash); color:var(--accent-ink); font-size:13px; font-weight:600; margin-top:1px; }
  .welcome-step-body{ display:flex; flex-direction:column; gap:2px; }
  .welcome-step-body b{ font-size:15px; font-weight:600; color:var(--ink); }
  .welcome-step-body span{ font-size:13.5px; line-height:1.5; color:var(--ink-faint); }
  .welcome-rels{ margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
  .welcome-rels-grid{ display:flex; flex-wrap:wrap; gap:9px 22px; }
  .welcome-foot{ display:flex; align-items:center; gap:16px; margin-top:28px; }
  .welcome-hint{ font-size:12px; color:var(--ink-ghost); }

  /* P2 — Leerzustand */
  .empty-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:40px; }
  .empty-inner{ max-width:460px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .empty-mark{ width:64px; height:64px; border-radius:16px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); margin-bottom:24px; }
  .empty-mark svg{ width:30px; height:30px; }
  .empty-title{ font-size:34px; font-weight:400; letter-spacing:-0.02em; color:var(--ink); margin:0; }
  .empty-sub{ font-size:15.5px; line-height:1.6; color:var(--ink-faint); margin:14px 0 0; text-wrap:pretty; }
  .empty-acts{ display:flex; gap:10px; margin-top:28px; flex-wrap:wrap; justify-content:center; }
  .empty-intro{ margin-top:18px; background:none; border:none; font:inherit; font-size:13px; color:var(--ink-faint); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .empty-intro:hover{ color:var(--accent-ink); }

  @media (max-width: 560px){
    .welcome{ padding:28px 22px 24px; }
    .welcome-scrim{ align-items:flex-start; }
    .welcome-foot{ flex-direction:column; align-items:flex-start; gap:10px; }
    .help-rels-grid{ grid-template-columns:1fr; }
  }
</style>
</head>

<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
