<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luhm 2.0 · Der eine Zettel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="z2-style.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="proto-data.jsx"></script>
<script type="text/babel" src="z2-themen.jsx"></script>
<script type="text/babel" src="z2-sheet.jsx"></script>
<script type="text/babel" src="z2-overlays.jsx"></script>
<script type="text/babel" src="z2-settings.jsx"></script>
<script type="text/babel" src="z2-readwise.jsx"></script>
<script type="text/babel" src="z2-graph.jsx"></script>
<script type="text/babel" src="z2-app.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="react">
  const W = 400, H = 560;
  const abStyle = { background: "transparent", boxShadow: "none", borderRadius: 0, overflow: "visible" };

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="zettel" title="Luhm 2.0 · Der eine Zettel"
          subtitle="Ein kleines Fenster, das EIN Zettel ist. Schreiben mit blinkendem Cursor · ⌘↑↓→ und Pfeil-Überlauf zum Bewegen · ⌘K springt. Drei Wege, die Struktur des Kastens zu spüren, ohne ihn zu sehen.">
          <DCArtboard id="karte" label="A · Karteikarte — der Stapel" width={W} height={H} style={abStyle}>
            <ZettelApp variant="karte" start="1/1" />
          </DCArtboard>
          <DCArtboard id="blatt" label="B · Leeres Blatt — nur die Seite" width={W} height={H} style={abStyle}>
            <ZettelApp variant="blatt" start="21/1" />
          </DCArtboard>
          <DCArtboard id="faden" label="C · Faden — Ort in der Reihe" width={W} height={H} style={abStyle}>
            <ZettelApp variant="faden" start="1/1" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
