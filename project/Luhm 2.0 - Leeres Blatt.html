<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luhm 2.0 · Leeres Blatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="z2-style.css" />
<style>
  /* Schreibtisch: ein ruhiger, warmer Grund, auf dem das Fenster schwebt. */
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(120% 90% at 50% 18%, oklch(0.955 0.010 86), oklch(0.905 0.014 82) 78%);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
  }
  #root{ width:min(430px, 92vw); height:min(620px, 90vh); }
  /* das Fenster füllt den Träger; Schatten/Ecken bringt .z2-win selbst mit */
  #root > .z2-win{ width:100%; height:100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="proto-data.jsx"></script>
<script type="text/babel" src="z2-themen.jsx"></script>
<script type="text/babel" src="z2-sheet.jsx"></script>
<script type="text/babel" src="z2-overlays.jsx"></script>
<script type="text/babel" src="z2-settings.jsx"></script>
<script type="text/babel" src="z2-readwise.jsx"></script>
<script type="text/babel" src="z2-graph.jsx"></script>
<script type="text/babel" src="z2-app.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById("root"))
    .render(<ZettelApp variant="blatt" start="1/1" autostart />);
</script>
</body>
</html>
